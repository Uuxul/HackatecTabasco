<div
    class="modal"
    id="emergencyModal"
>

    <div class="modal-box">


        <div class="modal-icon">

            <i class="fa-solid fa-bell"></i>

        </div>


        <h2>
            Solicitar ayuda
        </h2>


        <p>

            Tu ubicación será enviada al centro de monitoreo
            para atender la emergencia.

        </p>


        <div
            class="gps-preview"
            id="gpsPreview"
        >

            Obteniendo ubicación...

        </div>


        <button
            class="confirm"
            id="confirmEmergency"
        >

            ENVIAR EMERGENCIA

        </button>


        <button
            class="cancel"
            id="cancelEmergency"
        >

            Cancelar

        </button>


    </div>

</div>
