<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>CityFix Emergencias</title>


    <!-- LEAFLET -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >


    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >


    <!-- GOOGLE FONT -->
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    >


    <!-- NUESTROS ESTILOS -->
    <link
        rel="stylesheet"
        href="css/styles.css"
    >

</head>


<body>


<div class="app">


    <!-- ================================
         HEADER
    ================================= -->

    <header class="header">

        <div class="header-top">


            <div class="brand">

                <div class="shield">

                    <i class="fa-solid fa-person"></i>

                </div>


                <div class="brand-text">

                    <h1>
                        CITYFIX
                    </h1>

                    <span>
                        EMERGENCIAS
                    </span>

                </div>

            </div>


            <button class="bell">

                <i class="fa-regular fa-bell"></i>

            </button>


        </div>


        <div class="slogan">

            Tu seguridad, nuestra prioridad

        </div>

    </header>



    <!-- ================================
         MAPA
    ================================= -->

    <section class="map-wrapper">


        <div id="map"></div>


        <!-- INFORMACIÓN GPS -->

        <div class="location-card">

            <strong>
                Tu ubicación
            </strong>

            <span id="locationText">
                Buscando ubicación...
            </span>

        </div>



        <!-- CONTROLES DEL MAPA -->

        <div class="map-controls">


            <button
                class="map-control"
                id="centerLocation"
                title="Mi ubicación"
            >

                <i class="fa-solid fa-location-crosshairs"></i>

            </button>


            <button
                class="map-control"
                id="zoomLocation"
                title="Acercar"
            >

                <i class="fa-solid fa-crosshairs"></i>

            </button>


        </div>


    </section>



    <!-- ================================
         CONTENIDO
    ================================= -->

    <main class="content">


        <!-- SOLICITAR AYUDA -->

        <button
            class="help-button"
            id="helpButton"
        >

            <i class="fa-solid fa-bell"></i>


            <div class="help-text">

                <strong>
                    SOLICITAR AYUDA
                </strong>

                <span>
                    Reporta una emergencia
                </span>

            </div>


        </button>



        <!-- LLAMAR -->

        <button
            class="call-button"
            id="callButton"
        >


            <i class="fa-solid fa-phone"></i>


            <div class="call-text">

                <strong>
                    LLAMAR A EMERGENCIAS
                </strong>

                <span
                    class="call-number"
                    id="emergencyNumberText"
                >
                    911
                </span>

            </div>


        </button>



        <div class="non-emergency">

            ¿No es una emergencia?

        </div>



        <!-- REPORTE -->

        <button
            class="report-button"
            onclick="window.location.href='reporte.html'"
        >


            <i class="fa-solid fa-clipboard-list"></i>


            <div class="report-text">

                <strong>
                    CREAR REPORTE
                </strong>

                <span>
                    Ayúdanos a mejorar tu ciudad
                </span>

            </div>


        </button>


    </main>



    <!-- ================================
         SIDEBAR
    ================================= -->

    <div id="sidebar-container"></div>



    <!-- ================================
         NAVBAR
    ================================= -->

    <div id="navbar-container"></div>


</div>



<!-- ================================
     MODAL
================================= -->

<div id="modal-container"></div>



<!-- LEAFLET -->
<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<!-- NUESTRA APP -->
<script src="js/app.js"></script>


</body>

</html>
